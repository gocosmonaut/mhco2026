services:
  lscache_purger.commands.diag:
    class: Drupal\lscache_purger\Commands\LscacheDiagCommands
    # Arguments ARE required. These command classes live in src/Commands/,
    # not src/Drush/Commands/, so Drush's modern attribute auto-discovery
    # (which scans src/Drush/Commands/) does not find them; they are
    # discovered only via this file. On Drush 12/13 the LegacyServiceInstantiator
    # builds the service with ReflectionClass::newInstanceArgs($arguments) and
    # does NOT call the static create(ContainerInterface) factory. Omitting
    # arguments therefore calls `new LscacheDiagCommands()` with 0 args, which
    # throws ArgumentCountError during command discovery in bootstrapDrupalFull()
    # and breaks every drush command (status, cr, updb, cim), aborting deploys.
    # Regression shipped in 1.3.0 and 1.3.1; restored here for 1.3.2. The earlier
    # "double-wiring" worry was wrong for this layout: create() is never on the
    # path, so the arguments are the single source of DI. IDs match create().
    arguments:
      - '@http_client'
      - '@config.factory'
      - '@lscache.tag_header_builder'
      - '@state'
      - '@entity_type.manager'
      - '@datetime.time'
    tags:
      - { name: drush.command }

  lscache_purger.commands.coverage:
    class: Drupal\lscache_purger\Commands\LscacheCoverageCommands
    # Arguments required for the same reason as the diag command above
    # (src/Commands/ legacy discovery uses newInstanceArgs, not create()).
    arguments:
      - '@lscache_purger.list_tag_coverage'
    tags:
      - { name: drush.command }
